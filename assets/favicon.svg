<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0A1931" />
    </linearGradient>

    <!-- Gold Gradient for Ashoka Chakra & Shield -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Tricolor Accents -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0D5E06" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield / Icon Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#3B82F6" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Top Tricolor Ribbon Accent (Saffron) -->
  <path d="M 12 28 Q 64 20 116 28" fill="none" stroke="url(#saffronGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Bottom Tricolor Ribbon Accent (Green) -->
  <path d="M 12 100 Q 64 108 116 100" fill="none" stroke="url(#greenGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Center Golden Emblem / Ashok Chakra Circle -->
  <circle cx="64" cy="64" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="7" fill="url(#goldGrad)" />

  <!-- 24 Spokes of the Ashoka Chakra -->
  <g stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.95">
    <line x1="64" y1="38" x2="64" y2="57" />
    <line x1="64" y1="71" x2="64" y2="90" />
    <line x1="38" y1="64" x2="57" y2="64" />
    <line x1="71" y1="64" x2="90" y2="64" />

    <line x1="45.6" y1="45.6" x2="59" y2="59" />
    <line x1="69" y1="69" x2="82.4" y2="82.4" />
    <line x1="45.6" y1="82.4" x2="59" y2="69" />
    <line x1="69" y1="59" x2="82.4" y2="45.6" />

    <line x1="50.7" y1="40.7" x2="60.5" y2="57.2" />
    <line x1="67.5" y1="70.8" x2="77.3" y2="87.3" />
    <line x1="40.7" y1="50.7" x2="57.2" y2="60.5" />
    <line x1="70.8" y1="67.5" x2="87.3" y2="77.3" />

    <line x1="77.3" y1="40.7" x2="67.5" y2="57.2" />
    <line x1="60.5" y1="70.8" x2="50.7" y2="87.3" />
    <line x1="87.3" y1="50.7" x2="70.8" y2="60.5" />
    <line x1="57.2" y1="67.5" x2="40.7" y2="77.3" />
  </g>

  <!-- Surrounding Stars / Digital India Security Dots -->
  <circle cx="64" cy="18" r="2.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="20" cy="64" r="2.5" fill="#FF9933" opacity="0.9" />
  <circle cx="108" cy="64" r="2.5" fill="#138808" opacity="0.9" />
  <circle cx="64" cy="110" r="2.5" fill="#FFFFFF" opacity="0.9" />
</svg>
